<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guess The Rest">
  <!--
    The dartboard from the wordmark in the top-left of the site, drawn rather
    than set as an emoji so it renders the same on every platform.

    Ring widths get narrower towards the middle so that at 16px, where the inner
    rings merge into one mass, the icon still reads as a target rather than a
    plain red dot. The dart sits at the same angle as the emoji it replaces.
  -->
  <circle cx="32" cy="32" r="30" fill="#C8302A"/>
  <circle cx="32" cy="32" r="24" fill="#F4F3EC"/>
  <circle cx="32" cy="32" r="18" fill="#C8302A"/>
  <circle cx="32" cy="32" r="11" fill="#F4F3EC"/>
  <circle cx="32" cy="32" r="5.5" fill="#C8302A"/>

  <!-- Dart: shaft from the lower right into the bullseye, with its flight. -->
  <path d="M32 32 L57 50" stroke="#143524" stroke-width="4.6" stroke-linecap="round" fill="none"/>
  <path d="M50 41.5 L62 44 L57.5 55.5 Z" fill="#1F7A44"/>
  <circle cx="32" cy="32" r="3" fill="#143524"/>
</svg>
