<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ec" />
    <title>Guess The Rest — thirty-one guessing games</title>
    <meta name="description" content="Thirty-one guessing games. Name the song from a tenth of a second, the film from one second, the country from a street corner. Free, no account needed." />
    <link rel="canonical" href="https://guesstherest.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://guesstherest.com/" />
    <meta property="og:title" content="Guess The Rest" />
    <meta property="og:description" content="Thirty-one guessing games. A tenth of a second of a song. One second of a film. A street corner somewhere on Earth." />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      On a phone, opening a fresh connection to a new host costs a DNS lookup, a
      TCP handshake and a TLS handshake before a single byte of useful data
      moves. The song game needs two hosts it cannot know about until its
      JavaScript has parsed; starting those handshakes while the HTML is still
      being read takes that cost off the critical path. The audio host is the
      one that matters most, since that is the largest download in the game.
    -->
    <link rel="preconnect" href="https://itunes.apple.com" crossorigin />
    <link rel="preconnect" href="https://audio-ssl.itunes.apple.com" crossorigin />
    <link rel="dns-prefetch" href="https://en.wikipedia.org" />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />
    <link rel="dns-prefetch" href="https://maps.google.com" />

    <!--
      Versioned on purpose. Browsers cache a site's icon far more stubbornly than
      its cache headers ask them to — often for the life of the profile — so a
      redrawn icon at the same URL can go unseen for weeks. Bump ?v= whenever the
      artwork changes; it costs nothing and is the only reliable way to make the
      new one show up.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
